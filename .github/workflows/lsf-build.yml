name: LSF validation and Pi artifact
on:
  workflow_dispatch:
  push:
    branches: [lsf-mission-control]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy && rustup default 1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --profile dist --locked -p mctl
      - run: packaging/make-dist.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: lsf-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            config/lsf/
            scripts/lsf-display
            docs/lsf-mission-control.md
          if-no-files-found: error
